name: Build & Deploy

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Write .env.local
        run: |
          echo "WP_URL=${{ secrets.WP_URL }}" >> .env.local
          echo "WC_CONSUMER_KEY=${{ secrets.WC_CONSUMER_KEY }}" >> .env.local
          echo "WC_CONSUMER_SECRET=${{ secrets.WC_CONSUMER_SECRET }}" >> .env.local

      - name: Build
        run: npm run build

      - name: Deploy via FTP
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          sudo apt-get install -y lftp
          lftp -u "$FTP_USERNAME,$FTP_PASSWORD" "$FTP_HOST" -e "set ftp:ssl-allow yes; set ssl:verify-certificate no; set net:timeout 30; mirror --reverse --no-perms --parallel=5 ./out/ ./; bye"
